services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hogaria
      POSTGRES_PASSWORD: hogaria
      POSTGRES_DB: hogaria
    ports:
      - "5432:5432"
    volumes:
      - hogaria_db:/var/lib/postgresql/data

  db-test:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hogaria
      POSTGRES_PASSWORD: hogaria
      POSTGRES_DB: hogaria_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  hogaria_db:
